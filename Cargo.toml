[workspace]
members = ["crates/commonplace-core", "crates/commonplace-cli"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hannesloots/commonplace"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
htmd = "0.5"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"
strsim = "0.11"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# cherry-picked restriction lints
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
# pedantic opt-outs: internal library consumed only by the CLI
must_use_candidate = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
