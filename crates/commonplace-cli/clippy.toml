# Clippy reads the nearest clippy.toml, so this repeats the workspace settings.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
too-many-lines-threshold = 80

# Command errors must carry a code the agent can branch on.
disallowed-macros = [
    { path = "anyhow::bail", reason = "return a commonplace_core::Error so the agent gets an error code" },
    { path = "anyhow::anyhow", reason = "use a commonplace_core::Error constructor so the agent gets an error code" },
    { path = "anyhow::ensure", reason = "return a commonplace_core::Error so the agent gets an error code" },
]
