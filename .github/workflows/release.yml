name: release
on:
  push:
    tags: ["v*"]
  # Run by hand to (re)publish an existing release to the shelf marketplace
  # without rebuilding: Actions -> release -> Run workflow -> tag (e.g. v0.6.0).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to shelf (e.g. v0.6.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: fixture commonplace lints clean
        run: |
          cargo build
          ./target/debug/commonplace --root fixtures/demo lint --fail-on error

  build:
    if: github.event_name == 'push'
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false }   # cross-compiled on the arm64 runner; macos-13 is retired
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        run: pip install cargo-zigbuild && pip install ziglang
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p commonplace-cli
          else
            cargo build --release --target ${{ matrix.target }} -p commonplace-cli
          fi
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/commonplace$ext dist/commonplace-${{ matrix.target }}$ext
      - uses: actions/attest-build-provenance@v2
        # attestations are not available on user-owned private repositories
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: commonplace-${{ matrix.target }}
          path: dist/*

  package:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble skill bundles
        run: |
          mkdir -p skills/commonplace/bin
          cp artifacts/*/commonplace-* skills/commonplace/bin/
          chmod +x skills/commonplace/bin/* skills/commonplace/scripts/commonplace bin/commonplace hooks/stop-lint.sh
          (cd skills/commonplace/bin && sha256sum * > SHA256SUMS)
          # cloud bundle: linux x86_64 only (claude.ai / API sandbox, < 30 MB)
          mkdir -p out/cloud && cp -r skills/commonplace out/cloud/commonplace && rm -f out/cloud/commonplace/bin/commonplace-*apple* out/cloud/commonplace/bin/*windows* out/cloud/commonplace/bin/*aarch64*
          (cd out/cloud && zip -qr ../commonplace-skill-cloud.zip commonplace)
          # desktop bundle: all targets
          (cd skills && zip -qr ../out/commonplace-skill-desktop.zip commonplace)
          # plugin bundle: whole repo minus rust build
          zip -qr out/commonplace-plugin.zip plugin.json .claude-plugin skills bin hooks README.md LICENSE
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/commonplace-skill-cloud.zip
            out/commonplace-skill-desktop.zip
            out/commonplace-plugin.zip
            artifacts/*/commonplace-*
            skills/commonplace/bin/SHA256SUMS

  publish:
    # Push the built plugin into the shelf marketplace (hannesloots/shelf).
    # Runs after a tag release, or alone when dispatched by hand with a tag.
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: download the plugin from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern commonplace-plugin.zip --pattern SHA256SUMS
          ls -la rel
      - name: publish to shelf
        env:
          DEPLOY_KEY: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/marketplace && chmod 600 ~/.ssh/marketplace
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/marketplace -o IdentitiesOnly=yes"
          git clone -q git@github.com:hannesloots/shelf.git mkt
          rm -rf mkt/plugins/commonplace && mkdir -p mkt/plugins/commonplace
          (cd mkt/plugins/commonplace && unzip -q "$GITHUB_WORKSPACE/rel/commonplace-plugin.zip" && rm -f .claude-plugin/marketplace.json)
          # the dev repo ignores built binaries under bin/; the marketplace must track them
          rm -f mkt/plugins/commonplace/skills/commonplace/bin/.gitignore
          (cd mkt/plugins/commonplace/skills/commonplace/bin && sha256sum -c --ignore-missing --strict "$GITHUB_WORKSPACE/rel/SHA256SUMS")
          test -n "$(ls mkt/plugins/commonplace/skills/commonplace/bin/commonplace-* 2>/dev/null)" || { echo "no binaries in the plugin"; exit 1; }
          VERSION="${TAG#v}"
          # Claude Code and Copilot CLI read .claude-plugin/; Codex reads .agents/plugins/
          for m in mkt/.claude-plugin/marketplace.json mkt/.agents/plugins/marketplace.json; do
            jq --arg v "$VERSION" '(.plugins[] | select(.name == "commonplace") | .version) = $v' "$m" > "$m.new"
            mv "$m.new" "$m"
          done
          cd mkt
          git config user.name "commonplace release"
          git config user.email "release@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "shelf already has commonplace $VERSION; nothing to publish"; exit 0; fi
          git commit -q -m "commonplace $VERSION"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:master; then echo "published commonplace $VERSION to shelf"; exit 0; fi
            echo "push to shelf failed (attempt $attempt of 3)"; sleep 30
            git pull -q --rebase origin master || true
          done
          echo "::error::could not push to shelf after 3 attempts. Re-run this workflow by hand with tag=$TAG, or publish manually (see README)."
          exit 1
